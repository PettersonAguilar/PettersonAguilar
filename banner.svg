<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Petterson Aguilar</title>
  <desc id="d">Banner de perfil: estudante de Análise e Desenvolvimento de Sistemas com foco em banco de dados</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#17171c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4af37" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    .name{font:700 54px 'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:8px;fill:#f2f2f2}
    .sub{font:400 17px 'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:3px;fill:#d4af37}
    .tag{font:400 17px 'Courier New',Consolas,monospace;fill:#9a9aa5;opacity:0;animation:cycle 9s infinite}
    .t2{animation-delay:3s}
    .t3{animation-delay:6s}
    @keyframes cycle{0%{opacity:0}5%{opacity:1}30%{opacity:1}35%{opacity:0}100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.tag{animation:none}.t1{opacity:1}}
  </style>
  <rect width="1000" height="280" fill="url(#bg)"/>
  <rect width="1000" height="280" fill="url(#grid)"/>
  <path d="M24 60V24H60M940 24H976V60M976 220V256H940M60 256H24V220" fill="none" stroke="#d4af37" stroke-width="2"/>
  <text class="name" x="500" y="125" text-anchor="middle">PETTERSON AGUILAR</text>
  <rect x="300" y="145" width="400" height="2" fill="url(#gold)"/>
  <text class="sub" x="500" y="181" text-anchor="middle">ANÁLISE E DESENVOLVIMENTO DE SISTEMAS</text>
  <text class="tag t1" x="500" y="225" text-anchor="middle">&gt; especialização: banco de dados</text>
  <text class="tag t2" x="500" y="225" text-anchor="middle">&gt; linguagens: Python e JavaScript</text>
  <text class="tag t3" x="500" y="225" text-anchor="middle">&gt; front-end: HTML e CSS</text>
</svg>
